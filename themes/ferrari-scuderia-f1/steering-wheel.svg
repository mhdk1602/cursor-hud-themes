<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" opacity="0.32">
  <defs>
    <radialGradient id="wheel-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A0810" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#0A0406" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="screen-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4444" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#FF2020" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF2020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="carbon-fiber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0810" stop-opacity="1"/>
      <stop offset="50%" stop-color="#2A1018" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0A0406" stop-opacity="1"/>
    </linearGradient>
    <filter id="led-glow"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="soft-glow"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="strong-glow"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- ========= STEERING WHEEL BODY (Ferrari SF-style: rectangular top, round bottom) ========= -->
  <!-- Outer rim -->
  <path d="M 80 180
           L 80 130
           Q 80 90, 140 90
           L 360 90
           Q 420 90, 420 130
           L 420 180
           Q 420 320, 350 380
           Q 250 440, 150 380
           Q 80 320, 80 180 Z"
        fill="url(#carbon-fiber)" stroke="#FF2020" stroke-width="2.5" opacity="0.95"/>

  <!-- Inner cutout (creates the wheel shape) -->
  <path d="M 145 195
           L 145 165
           Q 145 145, 175 145
           L 325 145
           Q 355 145, 355 165
           L 355 195
           Q 355 285, 305 325
           Q 250 360, 195 325
           Q 145 285, 145 195 Z"
        fill="#0A0406" opacity="0.8"/>

  <!-- ========= REV COUNTER LED BAR (top of wheel) ========= -->
  <!-- LED housing strip -->
  <rect x="135" y="105" width="230" height="22" rx="4" fill="#000000" stroke="#FF2020" stroke-width="1" opacity="0.9"/>

  <!-- 15 LED lights  green ’ amber ’ red ’ blue progression (Ferrari F1 style) -->
  <g>
    <!-- Green LEDs (1-5): low/mid RPM -->
    <circle cx="148" cy="116" r="6" fill="#00FF44" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="148" cy="116" r="4" fill="#88FF88"/>
    <circle cx="164" cy="116" r="6" fill="#00FF44" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="164" cy="116" r="4" fill="#88FF88"/>
    <circle cx="180" cy="116" r="6" fill="#00FF44" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="180" cy="116" r="4" fill="#88FF88"/>
    <circle cx="196" cy="116" r="6" fill="#44FF22" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="196" cy="116" r="4" fill="#AAFF66"/>
    <circle cx="212" cy="116" r="6" fill="#88EE00" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="212" cy="116" r="4" fill="#CCFF66"/>

    <!-- Amber LEDs (6-10): mid/high RPM -->
    <circle cx="228" cy="116" r="6" fill="#FFEE00" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="228" cy="116" r="4" fill="#FFFF88"/>
    <circle cx="244" cy="116" r="6" fill="#FFB800" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="244" cy="116" r="4" fill="#FFD866"/>
    <circle cx="260" cy="116" r="6" fill="#FF8800" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="260" cy="116" r="4" fill="#FFAA66"/>
    <circle cx="276" cy="116" r="6" fill="#FF6B20" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="276" cy="116" r="4" fill="#FFAA88"/>
    <circle cx="292" cy="116" r="6" fill="#FF4444" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="292" cy="116" r="4" fill="#FF8888"/>

    <!-- Red LEDs (11-13): redline -->
    <circle cx="308" cy="116" r="6" fill="#FF1744" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="308" cy="116" r="4" fill="#FF6677"/>
    <circle cx="324" cy="116" r="6" fill="#FF1744" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="324" cy="116" r="4" fill="#FF6677"/>
    <circle cx="340" cy="116" r="6" fill="#FF1744" filter="url(#led-glow)" opacity="0.95"/>
    <circle cx="340" cy="116" r="4" fill="#FF6677"/>

    <!-- Blue LEDs (14-15): SHIFT NOW indicator -->
    <circle cx="356" cy="116" r="7" fill="#4488FF" filter="url(#led-glow)" opacity="1"/>
    <circle cx="356" cy="116" r="5" fill="#88BBFF"/>
  </g>

  <!-- ========= CENTER DISPLAY SCREEN ========= -->
  <rect x="195" y="200" width="110" height="60" rx="3" fill="#000000" stroke="#FF2020" stroke-width="1.5" opacity="0.9"/>
  <rect x="195" y="200" width="110" height="60" rx="3" fill="url(#screen-glow)" opacity="0.4"/>
  <!-- Screen content: gear indicator + speed -->
  <text x="250" y="232" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="22" font-weight="900" fill="#FF4444" opacity="0.95">7</text>
  <text x="250" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#FFB800" opacity="0.9" letter-spacing="2">312 KPH</text>

  <!-- Tiny screen detail lines -->
  <line x1="200" y1="206" x2="245" y2="206" stroke="#FFB800" stroke-width="0.4" opacity="0.5"/>
  <line x1="255" y1="206" x2="300" y2="206" stroke="#FFB800" stroke-width="0.4" opacity="0.5"/>

  <!-- ========= SCUDERIA FERRARI BADGE (top center, between LEDs and screen) ========= -->
  <g transform="translate(250, 165)">
    <!-- Shield shape -->
    <path d="M -18 -12 L 18 -12 L 18 6 Q 18 18, 0 22 Q -18 18, -18 6 Z"
          fill="#FFEE00" stroke="#000000" stroke-width="1.2" opacity="0.92"/>
    <!-- SF text -->
    <text x="0" y="6" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="11" font-weight="900" fill="#FF1744">SF</text>
  </g>

  <!-- ========= LEFT GRIP HANDLE ========= -->
  <ellipse cx="100" cy="240" rx="22" ry="55" fill="#1A0810" stroke="#FF2020" stroke-width="1.5" opacity="0.92" transform="rotate(-8, 100, 240)"/>
  <!-- Grip texture lines -->
  <g stroke="#FF4444" stroke-width="0.6" opacity="0.5">
    <line x1="85" y1="215" x2="115" y2="215" transform="rotate(-8, 100, 240)"/>
    <line x1="83" y1="225" x2="117" y2="225" transform="rotate(-8, 100, 240)"/>
    <line x1="82" y1="235" x2="118" y2="235" transform="rotate(-8, 100, 240)"/>
    <line x1="82" y1="245" x2="118" y2="245" transform="rotate(-8, 100, 240)"/>
    <line x1="83" y1="255" x2="117" y2="255" transform="rotate(-8, 100, 240)"/>
    <line x1="85" y1="265" x2="115" y2="265" transform="rotate(-8, 100, 240)"/>
  </g>

  <!-- ========= RIGHT GRIP HANDLE ========= -->
  <ellipse cx="400" cy="240" rx="22" ry="55" fill="#1A0810" stroke="#FF2020" stroke-width="1.5" opacity="0.92" transform="rotate(8, 400, 240)"/>
  <g stroke="#FF4444" stroke-width="0.6" opacity="0.5">
    <line x1="385" y1="215" x2="415" y2="215" transform="rotate(8, 400, 240)"/>
    <line x1="383" y1="225" x2="417" y2="225" transform="rotate(8, 400, 240)"/>
    <line x1="382" y1="235" x2="418" y2="235" transform="rotate(8, 400, 240)"/>
    <line x1="382" y1="245" x2="418" y2="245" transform="rotate(8, 400, 240)"/>
    <line x1="383" y1="255" x2="417" y2="255" transform="rotate(8, 400, 240)"/>
    <line x1="385" y1="265" x2="415" y2="265" transform="rotate(8, 400, 240)"/>
  </g>

  <!-- ========= BUTTONS / DIALS ========= -->
  <!-- Left side buttons -->
  <circle cx="115" cy="170" r="9" fill="#FF2020" stroke="#FFB800" stroke-width="0.8" opacity="0.85"/>
  <text x="115" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#000000">DRS</text>
  <circle cx="155" cy="170" r="7" fill="#FFB800" opacity="0.85"/>
  <circle cx="155" cy="170" r="3" fill="#FFEE00"/>

  <!-- Right side buttons -->
  <circle cx="385" cy="170" r="9" fill="#4488FF" stroke="#FFB800" stroke-width="0.8" opacity="0.85"/>
  <text x="385" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="700" fill="#000000">BOX</text>
  <circle cx="345" cy="170" r="7" fill="#FFB800" opacity="0.85"/>
  <circle cx="345" cy="170" r="3" fill="#FFEE00"/>

  <!-- Bottom row: rotary dials -->
  <circle cx="180" cy="295" r="14" fill="#1A0810" stroke="#FF2020" stroke-width="1.5" opacity="0.9"/>
  <circle cx="180" cy="295" r="10" fill="#0A0406"/>
  <line x1="180" y1="295" x2="180" y2="285" stroke="#FFB800" stroke-width="2" opacity="0.95"/>
  <text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#FF2020">DIFF</text>

  <circle cx="320" cy="295" r="14" fill="#1A0810" stroke="#FF2020" stroke-width="1.5" opacity="0.9"/>
  <circle cx="320" cy="295" r="10" fill="#0A0406"/>
  <line x1="320" y1="295" x2="328" y2="289" stroke="#FF4444" stroke-width="2" opacity="0.95"/>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#FF2020">BBAL</text>

  <!-- Tiny indicator dots scattered around -->
  <circle cx="220" cy="290" r="2.5" fill="#00FF44" opacity="0.85"/>
  <circle cx="235" cy="290" r="2.5" fill="#FFEE00" opacity="0.85"/>
  <circle cx="265" cy="290" r="2.5" fill="#FFEE00" opacity="0.85"/>
  <circle cx="280" cy="290" r="2.5" fill="#FF4444" opacity="0.85"/>

  <!-- ========= PADDLE SHIFTERS (behind wheel, hinted at edges) ========= -->
  <path d="M 70 220 L 60 270 L 75 290" stroke="#FFB800" stroke-width="2" fill="none" opacity="0.55"/>
  <path d="M 430 220 L 440 270 L 425 290" stroke="#FFB800" stroke-width="2" fill="none" opacity="0.55"/>

  <!-- ========= GLOWING ACCENT (hot lap red glow around wheel) ========= -->
  <ellipse cx="250" cy="240" rx="180" ry="170" fill="none" stroke="#FF2020" stroke-width="0.5" opacity="0.4"/>
</svg>
