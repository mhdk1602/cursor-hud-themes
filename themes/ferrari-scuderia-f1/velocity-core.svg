    <line x1="200" y1="32" x2="200" y2="53" transform="rotate(285,200,200)"/>
    <line x1="200" y1="32" x2="200" y2="53" transform="rotate(300,200,200)"/>
    <line x1="200" y1="32" x2="200" y2="53" transform="rotate(315,200,200)"/>
    <line x1="200" y1="32" x2="200" y2="53" transform="rotate(330,200,200)"/>
  </g>
  <g stroke="#FF2020" stroke-width="0.8" stroke-linecap="round" opacity="0.35">
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(15,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(45,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(75,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(105,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(135,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(165,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(195,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(225,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(255,200,200)"/>
    <line x1="200" y1="40" x2="200" y2="48" transform="rotate(345,200,200)"/>
