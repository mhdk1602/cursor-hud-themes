<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" opacity="0.25">
  <defs>
    <radialGradient id="core-heat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEECC" stop-opacity="1"/>
      <stop offset="30%" stop-color="#FF4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FF2020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outer-heat" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#FF2020" stop-opacity="0"/>
      <stop offset="85%" stop-color="#FF2020" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF2020" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-sm"><feGaussianBlur stdDeviation="1.5"/></filter>
    <filter id="blur-md"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="blur-lg"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="blur-speed"><feGaussianBlur stdDeviation="5 1"/></filter>
  </defs>

  <circle cx="200" cy="200" r="198" fill="url(#outer-heat)"/>

  <!-- SPEED STREAKS — long radiating lines -->
  <g opacity="0.5" stroke-linecap="round">
    <line x1="200" y1="170" x2="200" y2="2" stroke="#FF2020" stroke-width="2" filter="url(#blur-sm)"/>
    <line x1="200" y1="170" x2="200" y2="8" stroke="#FFB800" stroke-width="1.5" filter="url(#blur-sm)" transform="rotate(45,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="4" stroke="#FF2020" stroke-width="1.8" filter="url(#blur-sm)" transform="rotate(90,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="14" stroke="#FF4444" stroke-width="1.2" filter="url(#blur-sm)" transform="rotate(135,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="2" stroke="#FF2020" stroke-width="2" filter="url(#blur-sm)" transform="rotate(180,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="10" stroke="#FFB800" stroke-width="1.5" filter="url(#blur-sm)" transform="rotate(225,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="4" stroke="#FF2020" stroke-width="1.8" filter="url(#blur-sm)" transform="rotate(270,200,200)"/>
    <line x1="200" y1="170" x2="200" y2="16" stroke="#FF4444" stroke-width="1.2" filter="url(#blur-sm)" transform="rotate(315,200,200)"/>
  </g>
  <g opacity="0.3" stroke-linecap="round">
    <line x1="200" y1="165" x2="200" y2="30" stroke="#FF2020" stroke-width="0.8" transform="rotate(22,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="38" stroke="#FFB800" stroke-width="0.6" transform="rotate(67,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="24" stroke="#FF2020" stroke-width="0.7" transform="rotate(112,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="34" stroke="#FF4444" stroke-width="0.6" transform="rotate(157,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="28" stroke="#FF2020" stroke-width="0.7" transform="rotate(202,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="40" stroke="#FFB800" stroke-width="0.6" transform="rotate(247,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="26" stroke="#FF2020" stroke-width="0.8" transform="rotate(292,200,200)"/>
    <line x1="200" y1="165" x2="200" y2="36" stroke="#FF4444" stroke-width="0.6" transform="rotate(337,200,200)"/>
  </g>

  <!-- OUTER RING — dashed tire marks + glowing halo ring -->
  <circle cx="200" cy="200" r="168" fill="none" stroke="#FF2020" stroke-width="3" opacity="0.2" filter="url(#blur-md)"/>
  <circle cx="200" cy="200" r="168" fill="none" stroke="#FF2020" stroke-width="2" opacity="0.45" stroke-dasharray="8 4 2 4"/>
  <circle cx="200" cy="200" r="163" fill="none" stroke="#FF4444" stroke-width="0.6" opacity="0.25"/>

