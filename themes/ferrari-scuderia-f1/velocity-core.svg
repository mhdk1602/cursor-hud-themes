  <!-- MOTION TRAIL GHOST BLADES — offset +8°, heavily blurred (furthest afterimage) -->
  <g opacity="0.08" filter="url(#blur-md)" transform="rotate(8,200,200)">
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(30,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" transform="rotate(60,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(90,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(120,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" transform="rotate(150,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(180,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(210,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" transform="rotate(240,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(270,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" transform="rotate(300,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" transform="rotate(330,200,200)"/>
  </g>

