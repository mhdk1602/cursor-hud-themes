    <line x1="200" y1="36" x2="200" y2="50"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(30,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(60,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(90,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(120,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(150,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(180,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(210,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(240,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(270,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(300,200,200)"/>
    <line x1="200" y1="36" x2="200" y2="50" transform="rotate(330,200,200)"/>
  </g>
  <!-- REDLINE ZONE -->
  <g stroke="#FF1744" stroke-width="3.5" stroke-linecap="round" opacity="0.7">
