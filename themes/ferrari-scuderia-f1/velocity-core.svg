    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(30,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" opacity="0.35" transform="rotate(60,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(90,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(120,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" opacity="0.35" transform="rotate(150,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(180,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(210,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" opacity="0.35" transform="rotate(240,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(270,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FF2020" opacity="0.55" transform="rotate(300,200,200)"/>
    <path d="M197,175 L188,52 Q210,46 203,175 Z" fill="#FFB800" opacity="0.35" transform="rotate(330,200,200)"/>
  </g>

  <!-- INNER GOLD RING -->
  <circle cx="200" cy="200" r="100" fill="none" stroke="#FFB800" stroke-width="2" opacity="0.45"/>
  <circle cx="200" cy="200" r="96" fill="none" stroke="#FF2020" stroke-width="0.5" opacity="0.25"/>

  <!-- INNER AERO FINS -->
  <g opacity="0.45" filter="url(#blur-sm)">
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FFB800" opacity="0.55"/>
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FF4444" opacity="0.45" transform="rotate(60,200,200)"/>
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FFB800" opacity="0.55" transform="rotate(120,200,200)"/>
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FF4444" opacity="0.45" transform="rotate(180,200,200)"/>
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FFB800" opacity="0.55" transform="rotate(240,200,200)"/>
    <path d="M198,178 L193,108 Q205,105 202,178 Z" fill="#FF4444" opacity="0.45" transform="rotate(300,200,200)"/>
  </g>

  <!-- INNER STRUCTURAL RING -->
  <circle cx="200" cy="200" r="60" fill="none" stroke="#FF4444" stroke-width="2.5" opacity="0.55"/>
  <circle cx="200" cy="200" r="56" fill="none" stroke="#FFB800" stroke-width="0.8" opacity="0.35"/>

  <!-- HOT CORE -->
  <circle cx="200" cy="200" r="42" fill="url(#core-heat)" filter="url(#blur-lg)"/>
  <circle cx="200" cy="200" r="18" fill="#FF4444" opacity="0.5"/>
  <circle cx="200" cy="200" r="10" fill="#FFB800" opacity="0.6"/>
  <circle cx="200" cy="200" r="4" fill="#FFEECC" opacity="0.85"/>

  <!-- SPARK PARTICLES with comet tails -->
  <g opacity="0.6">
    <circle cx="200" cy="6" r="3" fill="#FFB800" filter="url(#blur-sm)"/>
    <line x1="200" y1="6" x2="200" y2="18" stroke="#FFB800" stroke-width="1.5" opacity="0.4" filter="url(#blur-sm)"/>
    <circle cx="342" cy="58" r="2.5" fill="#FF4444" filter="url(#blur-sm)"/>
    <line x1="342" y1="58" x2="330" y2="68" stroke="#FF4444" stroke-width="1" opacity="0.3" filter="url(#blur-sm)"/>
    <circle cx="395" cy="200" r="3" fill="#FFB800" filter="url(#blur-sm)"/>
    <line x1="395" y1="200" x2="383" y2="200" stroke="#FFB800" stroke-width="1.5" opacity="0.4" filter="url(#blur-sm)"/>
    <circle cx="342" cy="342" r="2.5" fill="#FF4444" filter="url(#blur-sm)"/>
    <line x1="342" y1="342" x2="330" y2="332" stroke="#FF4444" stroke-width="1" opacity="0.3" filter="url(#blur-sm)"/>
    <circle cx="200" cy="395" r="3" fill="#FFB800" filter="url(#blur-sm)"/>
    <line x1="200" y1="395" x2="200" y2="383" stroke="#FFB800" stroke-width="1.5" opacity="0.4" filter="url(#blur-sm)"/>
    <circle cx="58" cy="342" r="2.5" fill="#FF4444" filter="url(#blur-sm)"/>
    <line x1="58" y1="342" x2="70" y2="332" stroke="#FF4444" stroke-width="1" opacity="0.3" filter="url(#blur-sm)"/>
    <circle cx="6" cy="200" r="3" fill="#FFB800" filter="url(#blur-sm)"/>
    <line x1="6" y1="200" x2="18" y2="200" stroke="#FFB800" stroke-width="1.5" opacity="0.4" filter="url(#blur-sm)"/>
    <circle cx="58" cy="58" r="2.5" fill="#FF4444" filter="url(#blur-sm)"/>
    <line x1="58" y1="58" x2="70" y2="68" stroke="#FF4444" stroke-width="1" opacity="0.3" filter="url(#blur-sm)"/>
  </g>

  <!-- STRUCTURAL SPOKES -->
  <g stroke="#FF4444" stroke-width="0.7" opacity="0.35">
    <line x1="200" y1="140" x2="200" y2="55"/>
    <line x1="200" y1="140" x2="200" y2="55" transform="rotate(60,200,200)"/>
    <line x1="200" y1="140" x2="200" y2="55" transform="rotate(120,200,200)"/>
    <line x1="200" y1="140" x2="200" y2="55" transform="rotate(180,200,200)"/>
    <line x1="200" y1="140" x2="200" y2="55" transform="rotate(240,200,200)"/>
    <line x1="200" y1="140" x2="200" y2="55" transform="rotate(300,200,200)"/>
